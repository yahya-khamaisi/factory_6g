services:

  simulation:          # CPU-only (set force_cpu: true in config/config.json)
    build: .
    image: factory6g:latest
    volumes:
      - ./results:/app/results
      - ./config:/app/config:ro      # config.json plus the per-run configs (config_run_*.json)
      - ./data:/app/data:ro          # ray-traced channel bank
      - ./models:/app/models:ro      # trained checkpoints, without rebuilding the image
      - ./src:/app/src:ro            # live package source, as every locked run used

  simulation-torch:    # Phase 4: Sionna 2.2 on PyTorch (Dockerfile.torch); same mounts as `simulation`
    build:
      context: .
      dockerfile: Dockerfile.torch
    image: factory6g-torch:latest
    volumes:
      - ./results:/app/results
      - ./config:/app/config:ro
      - ./data:/app/data:ro
      - ./models:/app/models          # writable: training writes PyTorch weights here
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro

  simulation-gpu:      # GPU-accelerated (set force_cpu: false in config/config.json)
    build: .
    image: factory6g:latest
    volumes:
      - ./results:/app/results
      - ./config/config.json:/app/config/config.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  visualize:           # Ray-tracing visualization of factory environments
    build: .
    image: factory6g:latest
    volumes:
      - ./results:/app/results
      - ./config/config.json:/app/config/config.json:ro
    entrypoint: ["python", "-m", "factory6g.cli.visualize"]
    command: ["--factory-size", "s,m,l,apple"]

  viewer:              # Run viewer + Sionna RT 2.x radio maps; no TensorFlow (Dockerfile.viz)
    build:
      context: .
      dockerfile: Dockerfile.viz
    image: factory6g-viz:latest
    volumes:
      - ./results:/app/results
      - ./data:/app/data:ro          # channel bank manifest: hall geometry for the viewer
      - ./src:/app/src:ro            # live package source
    ports:
      - "8765:8765"

  monitor:             # Live monitor: follows every run and training log under results/ while they write
    image: factory6g-viz:latest
    volumes:
      - ./results:/app/results:ro    # read-only: the monitor never writes into a run
      - ./src:/app/src:ro
    entrypoint: ["python", "-m", "factory6g.viewer"]
    command: ["monitor", "results", "--port", "8766"]
    ports:
      - "8766:8766"

  train-estimator:     # Train the NeuralChannelEstimator inside Docker
    build: .
    image: factory6g:latest
    volumes:
      - ./models:/app/models          # trained weights persist on host
      - ./data:/app/data              # generated dataset persists on host
      - ./config:/app/config:ro
      - ./src:/app/src:ro             # live package source, as the simulation service
    entrypoint: ["python", "-m", "factory6g.cli.train"]
    command: ["--data", "data/channel_train.npz", "--output", "models/neural_estimator.keras"]

  thesis:              # Build thesis/main.pdf (XeLaTeX + biber via latexmk); output under thesis/build/
    image: texlive/texlive:latest
    volumes:
      - ./thesis:/work
    working_dir: /work
    entrypoint: ["latexmk"]
    command:
      - -synctex=1
      - -interaction=nonstopmode
      - -file-line-error
      - -xelatex
      - main.tex

  # To resume an interrupted run, override the command on the existing service:
  #   CPU: docker compose run simulation --config config/config.json --resume /app/results/20260315_092517_simulation
  #   GPU: docker compose run simulation-gpu --config config/config.json --resume /app/results/20260315_092517_simulation
