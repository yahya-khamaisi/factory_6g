<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory6G run viewer</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="Views">
    <a class="brand" href="#/run">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="var(--brand)"></rect><path d="M7 18V9l6 5 6-5v9" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path></svg>
      <span><strong>Factory6G</strong><small>Run viewer</small></span>
    </a>
    <div class="nav-group">Explore</div>
    <a href="#/floor" data-view="floor"><span class="key">1</span>Floor</a>
    <a href="#/timeline" data-view="timeline"><span class="key">2</span>Timeline</a>
    <div class="nav-group">Analyse</div>
    <a href="#/compare" data-view="compare"><span class="key">3</span>Compare</a>
    <a href="#/run" data-view="run"><span class="key">4</span>Run and checks</a>
    <div class="nav-group">Channel</div>
    <a href="#/hall" data-view="hall"><span class="key">5</span>3D hall</a>
    <a href="#/link" data-view="link"><span class="key">6</span>Link</a>
    <div class="nav-group">Industry 5.0</div>
    <a href="#/ops" data-view="ops"><span class="key">7</span>Operations</a>
    <div class="nav-foot">
      <button type="button" id="theme-toggle" class="ghost">Dark theme</button>
      <div class="status"><span class="dot"></span><span id="status-text">loading…</span></div>
    </div>
  </nav>

  <div class="main">
    <header class="context" aria-label="Run context">
      <div class="ctx-row">
        <div class="ctx-title"><strong id="view-title">Floor</strong><small id="run-name"></small></div>
        <label>Stage <select id="sel-stage"></select></label>
        <label><span class="swatch" id="method-swatch"></span>Method <select id="sel-method"></select></label>
        <label>vs <select id="sel-compare"></select></label>
        <div class="stepper" role="group" aria-label="Eb/N0">
          <button type="button" id="eb-down" aria-label="Lower Eb/N0">−</button>
          <span>Eb/N0 <strong id="eb-label"></strong></span>
          <button type="button" id="eb-up" aria-label="Raise Eb/N0">+</button>
        </div>
      </div>
      <div class="ctx-row scrub">
        <button type="button" id="prev" aria-label="Previous batch">‹</button>
        <button type="button" id="play" class="primary" aria-label="Play">▶</button>
        <button type="button" id="next" aria-label="Next batch">›</button>
        <label for="batch">Batch <strong id="batch-label"></strong></label>
        <input id="batch" type="range" min="0" value="0">
        <div class="seg" role="group" aria-label="Playback speed">
          <button type="button" data-speed="1" aria-pressed="true">1×</button>
          <button type="button" data-speed="4" aria-pressed="false">4×</button>
          <button type="button" data-speed="16" aria-pressed="false">16×</button>
        </div>
        <span class="hint">Space play · ← → batch · ↑ ↓ Eb/N0 · 1–7 views</span>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
