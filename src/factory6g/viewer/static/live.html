<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory6G live monitor</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="live.css">
</head>
<body>
<a class="skip" href="#page">Skip to content</a>
<div class="shell">
  <aside class="side" aria-label="Main">
    <a class="brand" href="#/overview">
      <svg width="28" height="28" viewBox="0 0 26 26" role="img" aria-label="Factory6G: factory with a wireless link"><rect width="26" height="26" rx="7" fill="var(--brand)"></rect><path d="M4 21v-8l4 2.4V13l4 2.4V13l4 2.4V21z" fill="#fff"></path><path d="M19.5 21V12" stroke="#fff" stroke-width="1.6" stroke-linecap="round"></path><circle cx="19.5" cy="11" r="1.3" fill="#fff"></circle><path d="M17.2 8.6a3.3 3.3 0 0 1 4.6 0M15.3 6.6a6 6 0 0 1 8.4 0" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"></path></svg>
      <span><strong>Factory6G</strong><small>Industry 5.0 · Live monitor</small></span>
    </a>
    <nav class="side-nav" id="side-nav">
      <a href="#/overview" data-page="overview">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg>
        <span>Overview</span></a>
      <a href="#/runs" data-page="runs">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15l4-5 3 3 4-6 3 4"/><path d="M3 3v14h14"/></svg>
        <span>Simulations</span><b class="badge" id="badge-runs" hidden></b></a>
      <a href="#/hall" data-page="hall">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2l7 4v8l-7 4-7-4V6z"/><path d="M3 6l7 4 7-4M10 10v8"/></svg>
        <span>Factory hall</span></a>
      <a href="#/compare" data-page="compare">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 14c3-1 4-6 7-6s4 4 7 3"/><path d="M3 9c3 1 5 4 8 4s4-3 6-4"/></svg>
        <span>Compare runs</span></a>
      <a href="#/training" data-page="training">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg>
        <span>Training</span><b class="badge" id="badge-train" hidden></b></a>
    </nav>
    <div class="side-foot">
      <div class="conn" id="conn" role="status" aria-live="polite"><span class="pulse"></span><span id="conn-text">connecting…</span></div>
      <button type="button" id="theme-toggle" class="ghost-btn">Dark theme</button>
    </div>
  </aside>

  <div class="page-wrap">
    <header class="page-head">
      <div class="crumbs" id="crumbs"></div>
      <div class="head-row">
        <div>
          <h1 id="page-title">Overview</h1>
          <p id="page-sub" class="page-sub"></p>
        </div>
        <div class="head-actions" id="head-actions"></div>
      </div>
    </header>
    <main id="page" class="page" tabindex="-1"></main>
  </div>
</div>
<script src="live.js"></script>
</body>
</html>
